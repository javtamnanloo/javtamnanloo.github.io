<svg viewBox="0 0 860 489" class="gst-svg gst-trend gst-wide" role="img" aria-label="Measured surface tension exists for polyethylene, polypropylene, and poly(1-butene) only. Molecular dynamics simulations of all six polymers show the surface tension dropping and then leveling off after about three carbons in the side chain" preserveAspectRatio="xMidYMid meet">
