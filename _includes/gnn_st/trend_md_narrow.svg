<svg viewBox="0 0 390 376" class="gst-svg gst-trend gst-narrow" role="img" aria-label="Measured surface tension exists for polyethylene, polypropylene, and poly(1-butene) only. Molecular dynamics simulations of all six polymers show the surface tension dropping and then leveling off after about three carbons in the side chain" preserveAspectRatio="xMidYMid meet">
